name: ci
on:
  # main runs this through release.yml, which publishes only after it passes.
  push:
    branches: [v2]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  hermetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.2.0 build==1.6.1 pillow==13.0.0
      - run: python scripts/build_extension.py --check
      - run: python -m pytest -q -m "not e2e"
      - run: python -m build --sdist --wheel
  e2e:
    needs: hermetic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          - os: ubuntu-latest
            required: true
          - os: macos-latest
            required: true
    runs-on: ${{ matrix.os }}
    # Set required to false to let a platform report without failing the workflow.
    continue-on-error: ${{ !matrix.required }}
    env:
      EDGE_BRIDGE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0
      - name: Ensure Edge
        shell: bash
        run: python tests/e2e/ensure_edge.py
      - run: python -u -m pytest -q -m e2e
