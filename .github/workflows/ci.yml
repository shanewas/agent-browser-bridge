name: ci
on:
  push:
    branches: [main, v2]
  pull_request:
jobs:
  hermetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest build
      - run: python scripts/build_extension.py --check
      - name: getfqdn timing
        run: python -c "import socket,time; t=time.time(); socket.getfqdn('127.0.0.1'); print('getfqdn', round(time.time()-t, 1))"
      - run: python -m pytest -q -m "not e2e"
      - run: python -m build --sdist --wheel
  e2e:
    needs: hermetic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          - os: ubuntu-latest
            required: false
          - os: macos-latest
            required: false
    runs-on: ${{ matrix.os }}
    # Only the Windows E2E job has been run against a real Edge. Whether the Linux and macOS
    # runners load an unpacked extension headless is unverified, so they report without failing
    # the workflow. Set required to true for a platform once a run there is green.
    continue-on-error: ${{ !matrix.required }}
    env:
      EDGE_BRIDGE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Ensure Edge
        shell: bash
        run: python tests/e2e/ensure_edge.py
      - run: python -u -m pytest -q -m e2e
