name: ci
on:
  # main runs this through release.yml, which publishes only after it passes.
  push:
    branches: [v2]
  pull_request:
  workflow_call:
jobs:
  hermetic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest build
      - run: python scripts/build_extension.py --check
      - run: python -m pytest -q -m "not e2e"
      - run: python -m build --sdist --wheel
  e2e:
    needs: hermetic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            required: true
          - os: ubuntu-latest
            required: false
          - os: macos-latest
            required: false
    runs-on: ${{ matrix.os }}
    # Only the Windows E2E job has been run against a real Edge. Whether the Linux runner
    # loads an unpacked extension headless is unverified, so it reports without failing
    # the workflow. Set required to true for a platform once a run there is green.
    continue-on-error: ${{ !matrix.required }}
    env:
      EDGE_BRIDGE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Ensure Edge
        shell: bash
        run: python tests/e2e/ensure_edge.py
      - name: Edge startup probe (temporary)
        if: runner.os != 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          ls -lR /etc/opt/edge "/Library/Managed Preferences" 2>/dev/null | head -40 || true
          env | grep -iE 'dbus|xdg|display|wayland' || true
          B=$(python tests/e2e/ensure_edge.py)
          for extra in "" "--password-store=basic --use-mock-keychain"; do
            P=$(mktemp -d)
            echo "=== probe extra=[$extra]"
            "$B" --headless=new --user-data-dir=$P --no-sandbox --disable-dev-shm-usage --remote-debugging-port=0 --no-first-run --enable-logging=stderr --v=1 $extra about:blank > $P/log 2>&1 &
            pid=$!
            for i in $(seq 60); do [ -f $P/DevToolsActivePort ] && { echo "devtools up after ${i}s"; break; }; sleep 1; done
            [ -f $P/DevToolsActivePort ] || echo "devtools NOT up after 60s"
            grep -v "dbus/" $P/log | head -120
            kill $pid 2>/dev/null; sleep 2; kill -9 $pid 2>/dev/null || true
          done
      - run: python -u -m pytest -q -m e2e
