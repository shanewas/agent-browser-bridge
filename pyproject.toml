[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-agent-bridge"
dynamic = ["version"]
description = "Let AI agents drive your open Microsoft Edge tabs by element reference, over MCP, a CLI, or Python."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shanewas Ahmed", email = "shanewasahmed@gmail.com" }
]
maintainers = [
    { name = "Shanewas Ahmed", email = "shanewasahmed@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["edge", "browser-automation", "agent", "cdp", "websocket", "ai-agents", "real-time", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/shanewas/edge-agent-bridge"
Repository = "https://github.com/shanewas/edge-agent-bridge"
Issues = "https://github.com/shanewas/edge-agent-bridge/issues"
Funding = "https://github.com/sponsors/shanewas"
"Microsoft Edge Add-on" = "https://microsoftedge.microsoft.com/addons/detail/agent-browser-bridge/dfkieodkfepoidihjapiggpjmfapanpd"

[project.scripts]
edge-bridge = "agent_browser_bridge.cli:main"
edge = "agent_browser_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_browser_bridge*"]

[tool.setuptools.package-data]
agent_browser_bridge = [
    "extension/*.js",
    "extension/*.html",
    "extension/*.json",
    "extension/icons/*.png"
]

[tool.setuptools.dynamic]
version = {attr = "agent_browser_bridge.__version__"}

[tool.pytest.ini_options]
markers = ["e2e: needs a running Edge with the extension"]
testpaths = ["tests"]
