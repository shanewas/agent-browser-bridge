[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-browser-bridge"
dynamic = ["version"]
description = "Let AI agents drive the browser tabs you already have open, by element reference, over MCP, a CLI, or Python."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Shanewas Ahmed", email = "shanewasahmed@gmail.com" }
]
maintainers = [
    { name = "Shanewas Ahmed", email = "shanewasahmed@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["edge", "chrome", "browser-automation", "agent", "cdp", "websocket", "ai-agents", "real-time", "mcp", "desktop", "computer-use", "screenshot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.optional-dependencies]
# The Windows desktop half (agent-bridge desktop ..., desktop_* tools) needs Pillow for PNG/JPEG and resizing.
desktop = ["pillow>=10"]

[project.urls]
Homepage = "https://github.com/shanewas/agent-browser-bridge"
Repository = "https://github.com/shanewas/agent-browser-bridge"
Issues = "https://github.com/shanewas/agent-browser-bridge/issues"
Funding = "https://github.com/sponsors/shanewas"
"Microsoft Edge Add-on" = "https://microsoftedge.microsoft.com/addons/detail/agent-browser-bridge/dfkieodkfepoidihjapiggpjmfapanpd"
"Chrome Web Store" = "https://chromewebstore.google.com/detail/lknjdleggnheadkkjfngphdbcglalmmg"
"Renamed from" = "https://pypi.org/project/edge-agent-bridge/"

[project.scripts]
agent-bridge = "agent_browser_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_browser_bridge*"]

[tool.setuptools.package-data]
agent_browser_bridge = [
    "extension/*.js",
    "extension/*.html",
    "extension/*.json",
    "extension/icons/*.png"
]

[tool.setuptools.dynamic]
version = {attr = "agent_browser_bridge.__version__"}

[tool.pytest.ini_options]
markers = ["e2e: needs a running Edge with the extension"]
testpaths = ["tests"]
